<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꽃게당 이벤트 슬롯머신</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .language-selector {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .lang-btn {
            background: #f0f0f0;
            border: 2px solid #ddd;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .lang-btn:hover {
            background: #e0e0e0;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .slot-machine {
            background: linear-gradient(145deg, #2c3e50, #34495e);
            padding: 40px;
            border-radius: 20px;
            margin: 30px auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            border: 8px solid #f39c12;
        }

        .slot-display {
            background: #000;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .slot-display::before {
            content: '🦀';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 200px;
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
        }

        .reel-container {
            width: 180px;
            height: 120px;
            background: linear-gradient(to bottom, #1a1a1a 0%, #2a2a2a 50%, #1a1a1a 100%);
            border: 4px solid #f39c12;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .reel-container::before,
        .reel-container::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 30px;
            z-index: 2;
            pointer-events: none;
        }

        .reel-container::before {
            top: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }

        .reel-container::after {
            bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }

        .reel {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            transition: transform 0.1s ease-out;
        }

        .reel.spinning {
            animation: none;
        }

        .symbol {
            width: 100%;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-align: center;
            padding: 10px;
            line-height: 1.3;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }

        button {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(243, 156, 18, 0.4);
            font-weight: bold;
            text-transform: uppercase;
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(243, 156, 18, 0.6);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        button.spinning {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .result {
            margin-top: 30px;
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
            min-height: 50px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .probability-table {
            margin-top: 30px;
            text-align: left;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }

        .probability-table h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .probability-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #dee2e6;
        }

        .probability-item:last-child {
            border-bottom: none;
        }

        .prize-name {
            font-weight: 500;
        }

        .prize-probability {
            color: #667eea;
            font-weight: bold;
        }

        .winning-line {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 4px;
            background: linear-gradient(90deg, transparent, #f39c12, #f39c12, transparent);
            z-index: 3;
            pointer-events: none;
            box-shadow: 0 0 10px #f39c12;
        }

        @media (max-width: 768px) {
            .reel-container {
                width: 140px;
                height: 100px;
            }
            
            .symbol {
                height: 100px;
                font-size: 14px;
            }
            
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">🦀 꽃게당 이벤트 슬롯머신</h1>
        
        <div class="language-selector">
            <button class="lang-btn active" onclick="changeLanguage('ko')">한국어</button>
            <button class="lang-btn" onclick="changeLanguage('en')">English</button>
            <button class="lang-btn" onclick="changeLanguage('zh')">中文</button>
            <button class="lang-btn" onclick="changeLanguage('ja')">日本語</button>
        </div>
        
        <div class="slot-machine">
            <div class="slot-display">
                <div class="winning-line"></div>
                <div class="reel-container">
                    <div class="reel" id="reel1"></div>
                </div>
                <div class="reel-container">
                    <div class="reel" id="reel2"></div>
                </div>
            </div>

            <button id="spinBtn" onclick="spin()">🎰 SPIN 🎰</button>
        </div>
        
        <div class="result" id="result"></div>

        <div class="probability-table">
            <h3 id="prizeTitle">🎁 경품 목록</h3>
            <div class="probability-item">
                <span class="prize-name" id="prize1">🦀 꽃게과자 경품</span>
            </div>
            <div class="probability-item">
                <span class="prize-name" id="prize2">🥤 음료 1캔 무료</span>
            </div>
            <div class="probability-item">
                <span class="prize-name" id="prize3">🍺 주류 1병 무료</span>
            </div>
            <div class="probability-item">
                <span class="prize-name" id="prize4">🦐 간장새우 4마리 or 대하장 2마리</span>
            </div>
            <div class="probability-item">
                <span class="prize-name" id="prize5">💰 전액 무료</span>
            </div>
            <div class="probability-item">
                <span class="prize-name" id="prize6">❌ 꽝</span>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'ko';
        let isSpinning = false;
        let spinIntervals = [];
        let finalSymbols = [];
        let stoppedReels = 0; // Track how many reels have stopped

        const translations = {
            ko: {
                title: '🦀 꽃게당 이벤트 슬롯머신',
                spinBtn: '🎰 START 🎰',
                stopBtn1: '⛔ STOP 1번째 ⛔',
                stopBtn2: '⛔ STOP 2번째 ⛔',
                prizeTitle: '🎁 경품 목록',
                prizes: {
                    crab: '🦀\n꽃게과자\n경품',
                    drink: '🥤\n음료 1캔\n무료',
                    alcohol: '🍺\n주류 1병\n무료',
                    shrimp: '🦐\n간장새우 4마리\nor 대하장 2마리',
                    jackpot: '💰\n🎉전액무료🎉',
                    lose: '❌\n꽝'
                },
                prize1: '🦀 꽃게과자 경품',
                prize2: '🥤 음료 1캔 무료',
                prize3: '🍺 주류 1병 무료',
                prize4: '🦐 간장새우 4마리 or 대하장 2마리',
                prize5: '💰 전액 무료',
                prize6: '❌ 꽝',
                congrats: '🎉 축하합니다!',
                tryAgain: '😢 꽝! 다음 기회에!',
                jackpotMsg: '🎊 대박! 전액 무료! 🎊'
            },
            en: {
                title: '🦀 Crab Restaurant Slot Machine',
                spinBtn: '🎰 START 🎰',
                stopBtn1: '⛔ STOP 1st ⛔',
                stopBtn2: '⛔ STOP 2nd ⛔',
                prizeTitle: '🎁 Prize List',
                prizes: {
                    crab: '🦀\nCrab Snack\nPrize',
                    drink: '🥤\n1 Free\nDrink',
                    alcohol: '🍺\n1 Free\nAlcohol',
                    shrimp: '🦐\n4 Soy Shrimp\nor 2 Prawns',
                    jackpot: '💰\nFull Meal\nFREE!',
                    lose: '❌\nNo Prize'
                },
                prize1: '🦀 Crab Snack Prize',
                prize2: '🥤 1 Free Drink',
                prize3: '🍺 1 Free Alcohol',
                prize4: '🦐 4 Soy Shrimp or 2 Tiger Prawns',
                prize5: '💰 Full Meal Free',
                prize6: '❌ No Prize',
                congrats: '🎉 Congratulations!',
                tryAgain: '😢 No Prize! Try Again!',
                jackpotMsg: '🎊 JACKPOT! Full Meal Free! 🎊'
            },
            zh: {
                title: '🦀 螃蟹餐厅老虎机',
                spinBtn: '🎰 开始 🎰',
                stopBtn1: '⛔ 停止第1个 ⛔',
                stopBtn2: '⛔ 停止第2个 ⛔',
                prizeTitle: '🎁 奖品列表',
                prizes: {
                    crab: '🦀\n螃蟹饼干\n奖品',
                    drink: '🥤\n免费饮料\n1罐',
                    alcohol: '🍺\n免费酒类\n1瓶',
                    shrimp: '🦐\n酱油虾4只\n或大虾2只',
                    jackpot: '💰\n全额\n免费!',
                    lose: '❌\n未中奖'
                },
                prize1: '🦀 螃蟹饼干奖品',
                prize2: '🥤 免费饮料1罐',
                prize3: '🍺 免费酒类1瓶',
                prize4: '🦐 酱油虾4只或大虾2只',
                prize5: '💰 全额免费',
                prize6: '❌ 未中奖',
                congrats: '🎉 恭喜您！',
                tryAgain: '😢 未中奖！下次再来！',
                jackpotMsg: '🎊 大奖! 全额免费! 🎊'
            },
            ja: {
                title: '🦀 カニ食堂スロットマシン',
                spinBtn: '🎰 スタート 🎰',
                stopBtn1: '⛔ 1番目 停止 ⛔',
                stopBtn2: '⛔ 2番目 停止 ⛔',
                prizeTitle: '🎁 景品リスト',
                prizes: {
                    crab: '🦀\nカニ菓子\n景品',
                    drink: '🥤\nドリンク1缶\n無料',
                    alcohol: '🍺\nお酒1本\n無料',
                    shrimp: '🦐\n醤油海老4尾\nまたは車海老2尾',
                    jackpot: '💰\n全額\n無料!',
                    lose: '❌\nハズレ'
                },
                prize1: '🦀 カニ菓子景品',
                prize2: '🥤 ドリンク1缶無料',
                prize3: '🍺 お酒1本無料',
                prize4: '🦐 醤油海老4尾または車海老2尾',
                prize5: '💰 全額無料',
                prize6: '❌ ハズレ',
                congrats: '🎉 おめでとうございます！',
                tryAgain: '😢 ハズレ！次回頑張って！',
                jackpotMsg: '🎊 大当たり! 全額無料! 🎊'
            }
        };

        const symbolColors = {
            crab: '#FF6B6B',
            drink: '#4ECDC4',
            alcohol: '#45B7D1',
            shrimp: '#F39C12',
            jackpot: '#FFD700',
            lose: '#95A5A6'
        };

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('title').textContent = t.title;
            document.getElementById('spinBtn').innerHTML = t.spinBtn;
            document.getElementById('prizeTitle').textContent = t.prizeTitle;
            document.getElementById('prize1').textContent = t.prize1;
            document.getElementById('prize2').textContent = t.prize2;
            document.getElementById('prize3').textContent = t.prize3;
            document.getElementById('prize4').textContent = t.prize4;
            document.getElementById('prize5').textContent = t.prize5;
            document.getElementById('prize6').textContent = t.prize6;
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            initReels();
        }

        function getWeightedSymbol() {
            const random = Math.random() * 100;
            
            if (random < 30) return 'crab';
            if (random < 50) return 'lose';
            if (random < 61.5) return 'drink';
            if (random < 66.5) return 'alcohol';
            if (random < 69.5) return 'shrimp';
            return 'jackpot';
        }

        function createSymbolElement(type) {
            const t = translations[currentLang];
            const symbol = document.createElement('div');
            symbol.className = 'symbol';
            symbol.textContent = t.prizes[type];
            symbol.style.backgroundColor = symbolColors[type];
            return symbol;
        }

        function initReels() {
            const reels = ['reel1', 'reel2'];
            const symbolTypes = ['crab', 'drink', 'alcohol', 'shrimp', 'jackpot', 'lose'];
            
            reels.forEach(reelId => {
                const reel = document.getElementById(reelId);
                reel.innerHTML = '';
                
                // Create enough symbols for smooth spinning
                for (let i = 0; i < 20; i++) {
                    const randomType = symbolTypes[Math.floor(Math.random() * symbolTypes.length)];
                    reel.appendChild(createSymbolElement(randomType));
                }
            });
        }

        function spin() {
            const t = translations[currentLang];
            const btn = document.getElementById('spinBtn');
            
            if (!isSpinning) {
                // Start spinning all reels
                isSpinning = true;
                stoppedReels = 0;
                finalSymbols = [];
                btn.innerHTML = t.stopBtn1;
                btn.classList.add('spinning');
                document.getElementById('result').textContent = '';
                
                const reels = ['reel1', 'reel2'];
                const symbolTypes = ['crab', 'drink', 'alcohol', 'shrimp', 'jackpot', 'lose'];
                
                reels.forEach((reelId) => {
                    const reel = document.getElementById(reelId);
                    let currentOffset = 0;
                    
                    const interval = setInterval(() => {
                        currentOffset -= 15;
                        reel.style.transform = `translateY(${currentOffset}px)`;
                        reel.style.transition = 'none';
                        
                        if (currentOffset % 120 === 0) {
                            const randomType = symbolTypes[Math.floor(Math.random() * symbolTypes.length)];
                            reel.appendChild(createSymbolElement(randomType));
                            
                            if (reel.children.length > 30) {
                                reel.removeChild(reel.firstChild);
                                currentOffset += 120;
                            }
                        }
                    }, 15);
                    
                    spinIntervals.push(interval);
                });
                
            } else {
                // Stop one reel at a time
                const reelIndex = stoppedReels;
                const reelId = ['reel1', 'reel2'][reelIndex];
                
                // Clear interval for this reel
                clearInterval(spinIntervals[reelIndex]);
                
                // Determine final symbol for this reel
                const finalSymbol = getWeightedSymbol();
                finalSymbols.push(finalSymbol);
                
                // Stop this reel
                const reel = document.getElementById(reelId);
                reel.innerHTML = '';
                reel.appendChild(createSymbolElement('lose'));
                reel.appendChild(createSymbolElement(finalSymbol));
                reel.appendChild(createSymbolElement('crab'));
                
                reel.style.transition = 'transform 0.15s ease-out';
                reel.style.transform = 'translateY(-120px)';
                
                stoppedReels++;
                
                // Update button text for next reel or show result
                if (stoppedReels === 1) {
                    btn.innerHTML = t.stopBtn2;
                } else if (stoppedReels === 2) {
                    // All reels stopped
                    setTimeout(() => {
                        showResult(finalSymbols);
                        isSpinning = false;
                        stoppedReels = 0;
                        finalSymbols = [];
                        btn.innerHTML = t.spinBtn;
                        btn.classList.remove('spinning');
                        btn.disabled = false;
                        spinIntervals = [];
                    }, 200);
                }
            }
        }

        function showResult(symbols) {
            const t = translations[currentLang];
            const resultDiv = document.getElementById('result');
            
            // Check if both symbols match (2 symbols now)
            const allSame = symbols[0] === symbols[1];
            
            if (allSame) {
                const prizeType = symbols[0];
                
                if (prizeType === 'jackpot') {
                    resultDiv.innerHTML = t.jackpotMsg;
                    resultDiv.style.color = '#FFD700';
                } else if (prizeType === 'lose') {
                    resultDiv.textContent = t.tryAgain;
                    resultDiv.style.color = '#95A5A6';
                } else {
                    const prizeMap = {
                        crab: t.prize1,
                        drink: t.prize2,
                        alcohol: t.prize3,
                        shrimp: t.prize4
                    };
                    resultDiv.innerHTML = `${t.congrats}<br>${prizeMap[prizeType]}`;
                    resultDiv.style.color = '#667eea';
                }
            } else {
                resultDiv.textContent = t.tryAgain;
                resultDiv.style.color = '#95A5A6';
            }
        }

        // Initialize
        initReels();
    </script>
</body>
</html>
